<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sleeveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721"/>
      <stop offset="60%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <radialGradient id="ringWear" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="88%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E2B3"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#8C6D23"/>
    </linearGradient>
  </defs>

  <!-- Album Outer Jacket Sleeve -->
  <rect width="400" height="400" rx="8" fill="url(#sleeveBg)"/>

  <!-- Vintage Vinyl Ring-wear circle -->
  <circle cx="200" cy="200" r="185" fill="url(#ringWear)"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Decorative Outer Border -->
  <rect x="18" y="18" width="364" height="364" rx="4" fill="none" stroke="#F3E5AB" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="23" y="23" width="354" height="354" fill="none" stroke="#F3E5AB" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Header Category & Catalog Number -->
  <text x="35" y="48" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#F3E5AB" letter-spacing="2">ROCK-RD-1290</text>
  <text x="365" y="48" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="end" letter-spacing="1">STEREO / 33⅓ RPM</text>
  
  <line x1="35" y1="58" x2="365" y2="58" stroke="#F3E5AB" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Album Gold Foil Seal / Badge -->
  <g transform="translate(35, 80)">
    <rect width="90" height="22" rx="3" fill="#F3E5AB" fill-opacity="0.15" stroke="#F3E5AB" stroke-width="0.8"/>
    <text x="45" y="15" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="700" fill="#F5E2B3" text-anchor="middle" letter-spacing="1">HISTORIC MASTER</text>
  </g>

  <!-- Main Album Title -->
  <text x="200" y="180" font-family="'Noto Serif TC', 'Cinzel', serif" font-size="34" font-weight="900" fill="url(#goldAccent)" text-anchor="middle" letter-spacing="4">《鴨子》&《傻瓜》</text>
  <text x="200" y="215" font-family="'Cinzel', 'Noto Sans TC', serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="3">蘇慧倫 (TARCY SU)</text>
  <text x="200" y="238" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#94A3B8" text-anchor="middle" letter-spacing="2">都會新女性流行風暴 雙白金</text>

  <!-- Center Decorative Audio Line -->
  <line x1="140" y1="255" x2="260" y2="255" stroke="#F3E5AB" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="200" cy="255" r="3" fill="#F3E5AB"/>

  <!-- Bottom Production Credits Block -->
  <rect x="35" y="300" width="330" height="65" rx="4" fill="#000000" fill-opacity="0.4" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
  <text x="48" y="322" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="#CBD5E1">製作協力・錄音混音工程・母帶後製：</text>
  <text x="48" y="338" font-family="'Noto Sans TC', sans-serif" font-size="10" font-weight="700" fill="url(#goldAccent)">陳宏佳 博士 (Hung-Chia Chen) × 滾石唱片 / 擺渡人</text>
  <text x="48" y="353" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#64748B">RELEASED: 1996-97 • MASTER RECORDING ARCHIVE</text>
  <text x="350" y="353" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="700" fill="#F3E5AB" text-anchor="end">PLATINUM CERTIFIED</text>
</svg>
