<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="silverPlate" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="silverEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="silverShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#silverShadow)">
    <!-- Outer Silver Bezel -->
    <circle cx="160" cy="160" r="145" fill="url(#silverEdge)"/>
    <circle cx="160" cy="160" r="138" fill="url(#silverPlate)"/>
    
    <!-- Concentric Precision Ridges -->
    <circle cx="160" cy="160" r="132" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="160" cy="160" r="126" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="160" cy="160" r="120" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="2,6"/>
    
    <!-- Inner Core Well -->
    <circle cx="160" cy="160" r="105" fill="#0F172A" stroke="url(#silverEdge)" stroke-width="3"/>
    
    <!-- Top AAM Badge -->
    <text x="160" y="118" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="3">AMERICAN ALLIANCE OF MUSEUMS</text>
    <line x1="100" y1="125" x2="220" y2="125" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.6"/>
    
    <!-- MUSE AWARD Title -->
    <text x="160" y="152" font-family="'Cinzel', 'Playfair Display', serif" font-size="21" font-weight="900" fill="url(#silverPlate)" text-anchor="middle" letter-spacing="2">MUSE AWARD</text>
    <text x="160" y="172" font-family="'Cinzel', serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SILVER WINNER</text>
    <text x="160" y="190" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">MEDIA &amp; TECHNOLOGY</text>
    
    <!-- Star at Bottom -->
    <polygon points="160,202 163,210 171,210 164,215 167,223 160,218 153,223 156,215 149,210 157,210" fill="#CBD5E1"/>
  </g>
</svg>
