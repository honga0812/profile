       LAYER 3: 前沿生成式 AI 與多媒體智能體 (GENERATIVE AI & AGENTIC MULTIMEDIA)
       ========================================================================= -->
  <g transform="translate(60, 225)" filter="url(#nodeGlow)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#132338" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="28" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#38BDF8" text-anchor="middle">LEVEL // 03</text>
    <text x="60" y="48" font-family="'Noto Serif TC', serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">生成式 AI</text>
    <text x="60" y="66" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="#7DD3FC" text-anchor="middle">RAG 與多媒體</text>

    <rect x="135" y="0" width="765" height="90" rx="8" fill="#0C1929" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="120" y1="45" x2="135" y2="45" stroke="#38BDF8" stroke-width="2"/>

