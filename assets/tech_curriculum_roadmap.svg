      <rect x="155" width="160" height="26" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="235" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">大數據分析與應用</text>

      <rect x="330" width="150" height="26" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="405" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">金融科技 (FinTech)</text>

      <rect x="495" width="175" height="26" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="582" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">管理資訊系統 (MIS)</text>

      <text x="5" y="52" font-family="'Space Grotesk', sans-serif" font-size="9.5" fill="#38BDF8">DATA &amp; DECISION:</text>
      <text x="165" y="52" font-family="'Noto Sans TC', sans-serif" font-size="9.5" fill="#CBD5E1">Power BI 視覺化 • Python 數據管線 • 伊索企業/資策會 BI 專案顧問 • Google GAIQ 分析認證</text>
    </g>
  </g>

  <!-- Connection Arrow 1 to 2 -->
  <path d="M 520 440 L 520 425" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="520,425 516,431 524,431" fill="#38BDF8"/>

