<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7A28"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <pattern id="techGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="600" rx="14" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3"/>
  <rect width="1000" height="600" rx="14" fill="url(#techGrid)"/>

  <!-- Top Title Header -->
  <g transform="translate(40, 42)">
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="3">CURRICULUM &amp; TECHNOLOGY ROADMAP // 資訊技術發展及教學藍圖</text>
    <text x="0" y="24" font-family="'Noto Serif TC', serif" font-size="20" font-weight="800" fill="#FFFFFF">陳宏佳 博士 • 資訊技術演進、開課教學與產學技術地圖</text>
    <text x="0" y="42" font-family="'Noto Sans TC', sans-serif" font-size="11" fill="#94A3B8">貫通「底層系統架構 ➔ 數據中台與商業智慧 ➔ 生成式 AI 與智能體 ➔ 企業轉型與永續策略」四大進階維度</text>
  </g>

  <!-- Right Legend -->
  <g transform="translate(680, 36)">
    <rect width="280" height="42" rx="6" fill="#131B2C" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.3"/>
    <circle cx="20" cy="21" r="5" fill="#D4AF37"/>
    <text x="32" y="25" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#F1F5F9">★ 全英語 EMI 核心課程</text>
    <rect x="155" y="15" width="12" height="12" rx="2" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <text x="175" y="25" font-family="'Noto Sans TC', sans-serif" font-size="10" fill="#CBD5E1">資訊技術專業課程</text>
  </g>

  <!-- Central Progression Spine Line (Left to Right / Bottom to Top Flow) -->
  <path d="M 120 520 L 120 150" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="4,4"/>

  <!-- =========================================================================
       LAYER 4 (TOP): 產學AI轉型與永續策略 (ENTERPRISE AI TRANSFORMATION & MOT)
       ========================================================================= -->
  <g transform="translate(60, 115)" filter="url(#nodeGlow)">
    <!-- Stage Indicator Pill -->
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#1A1F2C" stroke="#D4AF37" stroke-width="1.2"/>
    <text x="60" y="28" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#D4AF37" text-anchor="middle">LEVEL // 04</text>
    <text x="60" y="48" font-family="'Noto Serif TC', serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">產學策略</text>
    <text x="60" y="66" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">轉型與治理</text>

    <!-- Main Content Container -->
