       LAYER 1: 基礎系統與數據底層 (SYSTEMS & DATABASE INFRASTRUCTURE)
       ========================================================================= -->
  <g transform="translate(60, 445)" filter="url(#nodeGlow)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#131926" stroke="#94A3B8" stroke-width="1"/>
    <text x="60" y="28" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#94A3B8" text-anchor="middle">LEVEL // 01</text>
    <text x="60" y="48" font-family="'Noto Serif TC', serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">基礎基石</text>
    <text x="60" y="66" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">系統與資料庫</text>

    <rect x="135" y="0" width="765" height="90" rx="8" fill="#0A101C" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="120" y1="45" x2="135" y2="45" stroke="#94A3B8" stroke-width="2"/>

    <g transform="translate(155, 18)">
      <rect width="175" height="26" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="0.8"/>
      <text x="87" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">資料庫系統及應用 (SQL)</text>

      <rect x="190" width="165" height="26" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="0.8"/>
      <text x="272" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">系統分析與設計</text>

      <rect x="370" width="180" height="26" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="0.8"/>
      <text x="460" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">商業軟體與程式設計</text>

      <rect x="565" width="160" height="26" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="0.8"/>
      <text x="645" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">計算機概論 / 網路</text>

      <text x="5" y="52" font-family="'Space Grotesk', sans-serif" font-size="9.5" fill="#94A3B8">ENGINEERING &amp; CERTS:</text>
      <text x="165" y="52" font-family="'Noto Sans TC', sans-serif" font-size="9.5" fill="#CBD5E1">MCSE / MCSA 微軟系統工程師 • CCNA 思科網路工程師 • 和信超媒體 SE/SI • 歐特斯科技電信平台處經理 • 國家級 e-Taiwan / m-Taiwan 計畫</text>
    </g>
  </g>

  <!-- Bottom Caption Footer -->
  <g transform="translate(60, 565)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="0" y="18" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94A3B8">TAIPEI TECH • DEPT. OF INFORMATION &amp; FINANCE MANAGEMENT • PH.D. IN MIS // HUNG-CHIA CHEN</text>
    <text x="880" y="18" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="#D4AF37" text-anchor="end">連續四階技術實戰演進 • 產官學教研合一</text>
  </g>
</svg>
