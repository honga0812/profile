       ========================================================================= -->
  <g transform="translate(60, 335)" filter="url(#nodeGlow)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#162033" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="60" y="28" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#38BDF8" text-anchor="middle">LEVEL // 02</text>
    <text x="60" y="48" font-family="'Noto Serif TC', serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">數據與智慧</text>
    <text x="60" y="66" font-family="'Noto Sans TC', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">BI 與金融科技</text>

    <rect x="135" y="0" width="765" height="90" rx="8" fill="#0D1524" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="120" y1="45" x2="135" y2="45" stroke="#38BDF8" stroke-width="2"/>

