      <text x="125" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="700" fill="#FFF2CE" text-anchor="middle">★ 生成式人工智慧與多媒體應用 (EMI)</text>

      <!-- Course 2 -->
      <rect x="265" width="165" height="26" rx="4" fill="#172554" stroke="#38BDF8" stroke-width="1"/>
      <text x="347" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="600" fill="#BAE6FD" text-anchor="middle">生成式人工智慧實務</text>

      <!-- Course 3 -->
      <rect x="445" width="135" height="26" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="512" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">數位匯流應用</text>

      <!-- Course 4 -->
      <rect x="595" width="130" height="26" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="660" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">傳播科技與音樂</text>

      <text x="5" y="52" font-family="'Space Grotesk', sans-serif" font-size="9.5" fill="#38BDF8">TECH &amp; CERTIFICATION:</text>
      <text x="165" y="52" font-family="'Noto Sans TC', sans-serif" font-size="9.5" fill="#CBD5E1">NVIDIA RAG Agents with LLMs 原廠認證 • 檢索增強生成 • 向量檢索 (Vector DB) • 智能體工作流</text>
    </g>
  </g>

  <!-- Connection Arrow 2 to 3 -->
  <path d="M 520 330 L 520 315" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="520,315 516,321 524,321" fill="#38BDF8"/>

