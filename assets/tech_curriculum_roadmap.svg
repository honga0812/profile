    <line x1="120" y1="45" x2="135" y2="45" stroke="#D4AF37" stroke-width="2"/>

    <!-- Course Chips -->
    <g transform="translate(155, 18)">
      <!-- Course 1: EMI -->
      <rect width="210" height="26" rx="4" fill="#D4AF37" fill-opacity="0.15" stroke="#D4AF37" stroke-width="1"/>
      <text x="105" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" font-weight="700" fill="#FFF2CE" text-anchor="middle">★ 企業倫理與永續管理 (EMI)</text>

      <!-- Course 2 -->
      <rect x="225" width="180" height="26" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="315" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">AI與創新顧客關係管理 (CRM)</text>

      <!-- Course 3 -->
      <rect x="420" width="140" height="26" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="490" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">科技管理 (MOT)</text>

      <!-- Course 4 -->
      <rect x="575" width="150" height="26" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="650" y="17" font-family="'Noto Sans TC', sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">商業模式創新與永續</text>

      <!-- Skills Subtitle -->
      <text x="5" y="52" font-family="'Space Grotesk', sans-serif" font-size="9.5" fill="#94A3B8">PRACTICE &amp; GOVERNANCE:</text>
      <text x="165" y="52" font-family="'Noto Sans TC', sans-serif" font-size="9.5" fill="#CBD5E1">經濟部產業發展局 審查委員 • 企業 AI 轉型輔導 • 永續深度學習學術發表 (SSCI IF=3.9)</text>
    </g>
  </g>

  <!-- Connection Arrow 3 to 4 -->
  <path d="M 520 220 L 520 205" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="520,205 516,211 524,211" fill="#38BDF8"/>

