<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="goldPlate" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="25%" stop-color="#F3DC82"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA821C"/>
      <stop offset="100%" stop-color="#5E4308"/>
    </radialGradient>
    <linearGradient id="ringEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="50%" stop-color="#8C6D1F"/>
      <stop offset="100%" stop-color="#4A3406"/>
    </linearGradient>
    <filter id="medalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Medal Body -->
  <g filter="url(#medalShadow)">
    <!-- Outer Bezel -->
    <circle cx="160" cy="160" r="145" fill="url(#ringEdge)"/>
    <circle cx="160" cy="160" r="138" fill="url(#goldPlate)"/>
    
    <!-- Concentric Precision Ridges -->
    <circle cx="160" cy="160" r="132" fill="none" stroke="#684C07" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="160" cy="160" r="126" fill="none" stroke="#FFF7D6" stroke-width="1" stroke-opacity="0.8"/>
    
    <!-- Outer Beaded Rim -->
    <circle cx="160" cy="160" r="120" fill="none" stroke="#AA821C" stroke-width="2.5" stroke-dasharray="2,6"/>
    
    <!-- Inner Core Well -->
    <circle cx="160" cy="160" r="105" fill="#131722" stroke="url(#ringEdge)" stroke-width="3"/>
    
    <!-- Laurel Wreath in Core -->
    <path d="M95,160 C90,130 110,90 160,85 C210,90 230,130 225,160 C220,195 195,225 160,230 C125,225 100,195 95,160 Z" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <!-- Inscriptions -->
    <text x="160" y="118" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="700" fill="#F3DC82" text-anchor="middle" letter-spacing="3">ICOM • AVICOM</text>
    <line x1="120" y1="125" x2="200" y2="125" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.6"/>
    
    <!-- GRAND PRIX Title -->
    <text x="160" y="152" font-family="'Cinzel', 'Playfair Display', serif" font-size="22" font-weight="900" fill="url(#goldPlate)" text-anchor="middle" letter-spacing="2">GRAND PRIX</text>
    <text x="160" y="172" font-family="'Cinzel', serif" font-size="13" font-weight="800" fill="#FFF5D1" text-anchor="middle" letter-spacing="3">FIAMP 2006</text>
    <text x="160" y="190" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#CBD5E1" text-anchor="middle" letter-spacing="2">PARIS, FRANCE</text>
    
    <!-- Star at Bottom -->
    <polygon points="160,202 163,210 171,210 164,215 167,223 160,218 153,223 156,215 149,210 157,210" fill="#F3DC82"/>
  </g>
</svg>
